<div class="auth-page">
  <div class="auth-card card">
    <div class="auth-brand">◆ ShopEZ</div>
    <h2>Create account</h2>
    <p class="auth-sub">Join ShopEZ today</p>

    <div class="alert alert-danger" *ngIf="error">{{ error }}</div>

    <div class="form-group">
      <label>Full Name</label>
      <input class="form-control" type="text" [(ngModel)]="name" placeholder="Your name" />
    </div>
    <div class="form-group">
      <label>Email</label>
      <input class="form-control" type="email" [(ngModel)]="email" placeholder="you@example.com" />
    </div>
    <div class="form-group">
      <label>Password</label>
      <input class="form-control" type="password" [(ngModel)]="password" placeholder="••••••••" />
    </div>
    <div class="form-group">
      <label>Role</label>
      <select class="form-control" [(ngModel)]="role">
        <option value="Customer">Customer</option>
        <option value="Admin">Admin</option>
      </select>
    </div>

    <button class="btn btn-primary auth-btn" [disabled]="loading" (click)="register()">
      {{ loading ? 'Creating account...' : 'Create Account' }}
    </button>

    <div class="auth-footer">
      Already have an account? <a routerLink="/login">Sign in</a>
    </div>
  </div>
</div>
