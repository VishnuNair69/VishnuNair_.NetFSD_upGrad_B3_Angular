<div class="auth-page">
  <div class="auth-card card">
    <div class="auth-brand">◆ ShopEZ</div>
    <h2>Welcome back</h2>
    <p class="auth-sub">Sign in to your account</p>

    <div class="alert alert-danger" *ngIf="error">{{ error }}</div>

    <div class="form-group">
      <label>Email</label>
      <input class="form-control" type="email" [(ngModel)]="email" placeholder="you@example.com" />
    </div>
    <div class="form-group">
      <label>Password</label>
      <input class="form-control" type="password" [(ngModel)]="password" placeholder="••••••••" (keyup.enter)="login()" />
    </div>

    <button class="btn btn-primary auth-btn" [disabled]="loading" (click)="login()">
      {{ loading ? 'Signing in...' : 'Sign In' }}
    </button>

    <div class="auth-footer">
      Don't have an account?
      <a routerLink="/register">Register here</a>
    </div>

    <div class="demo-hint">
      <strong>Demo:</strong> Use any registered email. Role is assigned at registration.
    </div>
  </div>
</div>
