<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Location-Based Logger</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 30px auto;
    }
    button {
      padding: 8px 12px;
      cursor: pointer;
    }
    .error {
      color: red;
    }
    .success {
      color: green;
    }
    ul {
      padding-left: 20px;
    }
  </style>
</head>
<body>

  <h2>Location-Based Logger</h2>

  <button onclick="getLocation()">Get My Location</button>

  <p id="status"></p>

  <h3>Current Location</h3>
  <p>Latitude: <span id="lat">-</span></p>
  <p>Longitude: <span id="lng">-</span></p>

  <h3>Location History (Last 5)</h3>
  <ul id="history"></ul>

  <script>
    // Load history on page load
    window.onload = function () {
      renderHistory();
    };

    function getLocation() {
      const status = document.getElementById("status");

      if (!navigator.geolocation) {
        status.textContent = "Geolocation is not supported by your browser";
        status.className = "error";
        return;
      }

      status.textContent = "Fetching location...";
      status.className = "";

      navigator.geolocation.getCurrentPosition(
        successCallback,
        errorCallback,
        { timeout: 10000 }
      );
    }

    function successCallback(position) {
      const latitude = position.coords.latitude.toFixed(6);
      const longitude = position.coords.longitude.toFixed(6);

      document.getElementById("lat").textContent = latitude;
      document.getElementById("lng").textContent = longitude;

      const entry = {
        lat: latitude,
        lng: longitude,
        time: new Date().toLocaleString()
      };

      let history = JSON.parse(localStorage.getItem("locationHistory")) || [];

      history.unshift(entry);      // add newest to top
      history = history.slice(0, 5); // keep only last 5

      localStorage.setItem("locationHistory", JSON.stringify(history));

      renderHistory();

      const status = document.getElementById("status");
      status.textContent = "Location saved ";
      status.className = "success";
    }

    

    function renderHistory() {
      const historyList = document.getElementById("history");
      historyList.innerHTML = "";

      const history = JSON.parse(localStorage.getItem("locationHistory")) || [];

      history.forEach((item, index) => {
        const li = document.createElement("li");
        li.textContent = `${index + 1}. Lat: ${item.lat}, Lng: ${item.lng} (${item.time})`;
        historyList.appendChild(li);
      });
    }
  </script>

</body>
</html>
