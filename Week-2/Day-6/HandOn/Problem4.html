<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Mini Expense Tracker (Web SQL)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 30px auto;
    }
    input {
      padding: 6px;
      margin-right: 6px;
    }
    button {
      padding: 6px 10px;
      margin-right: 6px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 6px;
      text-align: center;
    }
    .error {
      color: red;
    }
  </style>
</head>
<body>

  <h2> Mini Expense Tracker</h2>

  <input type="text" id="title" placeholder="Expense Title" />
  <input type="number" id="amount" placeholder="Amount" />
  <input type="date" id="date" />

  <br /><br />

  <button onclick="addExpense()">Add Expense</button>
  <button onclick="viewExpenses()">View Expenses</button>
  <button onclick="deleteExpense()">Delete Expense (Last)</button>

  <p id="status"></p>

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Amount</th>
        <th>Date</th>
      </tr>
    </thead>
    <tbody id="expenseList"></tbody>
  </table>

  <script>
    
  </script>

</body>
</html>
