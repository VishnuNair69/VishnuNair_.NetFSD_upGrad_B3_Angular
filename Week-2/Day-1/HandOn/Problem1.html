<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Personal Notes Saver</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 500px;
      margin: auto;
    }
    textarea {
      width: 100%;
      height: 150px;
      margin-bottom: 10px;
    }
    button {
      margin-right: 10px;
      padding: 8px 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h2>📝 Personal Notes Saver</h2>

  <textarea id="noteInput" placeholder="Write your note here..."></textarea>

  <br />

  <button onclick="saveNote()">Save</button>
  <button onclick="clearNote()">Clear</button>

  <script>
    // Load note on page refresh
    window.onload = function () {
      const savedNote = localStorage.getItem("dailyNote");
      if (savedNote) {
        document.getElementById("noteInput").value = savedNote;
      }
    };

    // Save note
    function saveNote() {
      const note = document.getElementById("noteInput").value;
      localStorage.setItem("dailyNote", note);
      alert("Note saved ✅");
    }

    // Clear note
    function clearNote() {
      localStorage.removeItem("dailyNote");
      document.getElementById("noteInput").value = "";
      alert("Note cleared 🧹");
    }
  </script>

</body>
</html>
